# Save as ~/.cliffwatch/config.yaml; secret VALUES belong in environment variables.
intervalSeconds: 300
timeoutMs: 10000
dashboardPort: 3000
# Optional: dataFile: /absolute/path/to/cliffwatch.sqlite
# A relative dataFile is resolved beside this config file.
thresholds: [70, 85, 95]
# Predictive alerts require enough continuous history to estimate exhaustion.
# They are opt-in so an upgrade never creates a new notification policy silently.
predictiveAlerts:
  enabled: false
  leadTimeHours: 24
providers:
  codex:
    enabled: true
    source: live
    command: codex # Use absolute path to executable if not on PATH.
  openrouter:
    enabled: false # Set true only after defining OPENROUTER_API_KEY.
    keyEnv: OPENROUTER_API_KEY
    scope: key # account uses /credits and requires management-key permission.
channels:
  - type: desktop
  # Optional fallbacks, tried in listed order after two failed attempts:
  # - type: webhook
  #   urlEnv: CLIFFWATCH_WEBHOOK_URL
  # - type: ntfy
  #   urlEnv: CLIFFWATCH_NTFY_URL
  # - type: telegram
  #   botTokenEnv: CLIFFWATCH_TELEGRAM_TOKEN
  #   chatIdEnv: CLIFFWATCH_TELEGRAM_CHAT_ID
  # - type: discord
  #   urlEnv: CLIFFWATCH_DISCORD_URL
