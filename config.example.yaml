# Save as ~/.quotadog/config.yaml; secret VALUES belong in environment variables.
intervalSeconds: 300
timeoutMs: 10000
dashboardPort: 3000
# Optional: dataFile: /absolute/path/to/quotadog.sqlite
# A relative dataFile is resolved beside this config file.
thresholds: [70, 85, 95]
providers:
  codex:
    enabled: true
    source: live
    command: codex # Use absolute path to executable if not on PATH.
  openrouter:
    enabled: true
    keyEnv: OPENROUTER_API_KEY
    scope: key # account uses /credits and requires management-key permission.
channels:
  - type: webhook
    urlEnv: QUOTADOG_WEBHOOK_URL
  # Optional fallbacks, tried in listed order after two failed attempts:
  # - type: ntfy
  #   urlEnv: QUOTADOG_NTFY_URL
  # - type: telegram
  #   botTokenEnv: QUOTADOG_TELEGRAM_TOKEN
  #   chatIdEnv: QUOTADOG_TELEGRAM_CHAT_ID
  # - type: discord
  #   urlEnv: QUOTADOG_DISCORD_URL
  # - type: desktop
