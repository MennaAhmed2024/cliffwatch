# Save as ~/.quotadog/config.yaml; secret VALUES belong in environment variables.
intervalSeconds: 300
timeoutMs: 10000
thresholds: [70, 85, 95]
providers:
  codex:
    enabled: true
    source: live
    command: codex # Use absolute path to executable if not on PATH.
  openrouter:
    enabled: true
    keyEnv: OPENROUTER_API_KEY
    scope: key # account uses /credits and requires management-key permission.
channels:
  - type: webhook
    urlEnv: QUOTADOG_WEBHOOK_URL
